global
    maxconn 10000
    log stdout format raw local0

defaults
    log global
    mode tcp
    retries 3
    timeout queue 1m
    timeout connect 10s
    timeout client 30m
    timeout server 30m
    timeout check 2s

# ─────────────────────────────────────────────────────────────────────────────
# HAProxy Statistics Dashboard
# 可在浏览器通过 http://localhost:7000 实时查看数据库集群主从心跳大屏
# ─────────────────────────────────────────────────────────────────────────────
listen stats
    mode http
    bind 0.0.0.0:7000
    stats enable
    stats uri /
    stats refresh 5s

# ─────────────────────────────────────────────────────────────────────────────
# 1. PostgreSQL HA Write Pool (Port 5000)
# 强制仅路由至处于 Active Primary 状态的 Patroni 节点
# ─────────────────────────────────────────────────────────────────────────────
backend pg_write_backend
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-node1 pg-node1:5432 maxconn 1000 check port 8008
    server pg-node2 pg-node2:5432 maxconn 1000 check port 8008
    server pg-node3 pg-node3:5432 maxconn 1000 check port 8008

frontend pg_write_front
    bind 0.0.0.0:5000
    mode tcp
    default_backend pg_write_backend

# ─────────────────────────────────────────────────────────────────────────────
# 2. PostgreSQL HA Read-Only Pool (Port 5001)
# 负载均衡路由至处于健康从节点（Replica）状态的节点
# ─────────────────────────────────────────────────────────────────────────────
backend pg_read_backend
    mode tcp
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server pg-node1 pg-node1:5432 maxconn 2000 check port 8008
    server pg-node2 pg-node2:5432 maxconn 2000 check port 8008
    server pg-node3 pg-node3:5432 maxconn 2000 check port 8008

frontend pg_read_front
    bind 0.0.0.0:5001
    mode tcp
    default_backend pg_read_backend
