# 🌌 12306 Production Environment Ansible Inventory - PostgreSQL HA Cluster
# 生产环境物理机/虚拟机资产清单定义

[etcd]
etcd-node1 ansible_host=10.0.10.11 etcd_name=etcd1
etcd-node2 ansible_host=10.0.10.12 etcd_name=etcd2
etcd-node3 ansible_host=10.0.10.13 etcd_name=etcd3

[postgres]
pg-prod1 ansible_host=10.0.10.21 patroni_name=pg-node1
pg-prod2 ansible_host=10.0.10.22 patroni_name=pg-node2
pg-prod3 ansible_host=10.0.10.23 patroni_name=pg-node3

[haproxy]
pg-lb1 ansible_host=10.0.10.31
pg-lb2 ansible_host=10.0.10.32

[pgbouncer]
pg-pool1 ansible_host=10.0.10.41
pg-pool2 ansible_host=10.0.10.42

[all:vars]
ansible_user=sre_ops
ansible_ssh_private_key_file=~/.ssh/id_rsa_prod
ansible_become=true
