apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-web-api
  namespace: ticketing-prod
  labels:
    app: ticketing-web-api
spec:
  replicas: 5 # 初始 5 节点保底
  selector:
    matchLabels:
      app: ticketing-web-api
  template:
    metadata:
      labels:
        app: ticketing-web-api
    spec:
      containers:
      - name: web-api
        image: ticketing_web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "mysql+aiomysql://root:root@mysql.ticketing-prod.svc.cluster.local:3306/ticketing_db"
        - name: REDIS_URL
          value: "redis://redis.ticketing-prod.svc.cluster.local:6379/0"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka.ticketing-prod.svc.cluster.local:9092"
        resources:
          requests:
            cpu: "1000m" # 1 Core 保底请求
            memory: "2Gi"
          limits:
            cpu: "2000m" # 2 Core 上限，避免单节点 CPU 饥饿
            memory: "4Gi"
        readinessProbe: # SRE 就绪性检测探针，确保 Pod 处于真正可用状态才接入 Service 流量
          httpGet:
            path: /api/v1/ops/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe: # SRE 存活性检测探针，故障自动重启
          httpGet:
            path: /api/v1/ops/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: ticketing-web-api-svc
  namespace: ticketing-prod
spec:
  selector:
    app: ticketing-web-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP

---

# 🌌 1. 针对无状态 Web 查询/预占核心的 HPA (HorizontalPodAutoscaler)
# 基于 CPU/Memory 平均水位在 5 到 100 个 Pod 间极速动态扩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketing-web-api-hpa
  namespace: ticketing-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketing-web-api
  minReplicas: 5
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75 # CPU 平均水位超 75% 即刻触发极速横向扩容
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80 # 内存平均水位超 80% 触发扩容
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # 立即扩容，抢票瞬间不允许有任何延迟！
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15 # 允许每 15 秒实例数最高翻倍，支持灾难级流量突涌
    scaleDown:
      stabilizationWindowSeconds: 300 # 300s 稳定窗口，防止流量波动导致的抖动（Thrashing）
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60 # 每分钟缓慢缩容 10%，保全物理大后方

---

# 🌌 2. 针对投影器消费端的 KEDA (Kubernetes Event-driven Autoscaling)
# 基于 Kafka 消费者组积压量 (Lag) 动态扩缩容 Projector
# 如果高峰期退票/支付事件堆积在 Kafka 中，投影器自动横向拉起，自愈时差压缩至 100ms
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ticketing-projector-keda
  namespace: ticketing-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketing-projector # 目标是我们的投影器消费端 Deployment
  minReplicas: 2 # 至少双活热备
  maxReplicas: 32 # 配合 Kafka Topic Partitions 最大扩至 32 个并行消费者
  cooldownPeriod: 120 # 2分钟无积压后缩容
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka.ticketing-prod.svc.cluster.local:9092
      consumerGroup: 12306-projector-group
      topic: ticket_events
      lagThreshold: "100" # 只要该消费者组积压消息数超 100 条，代表投影自愈时差变大，立刻启动快速弹性扩容！
