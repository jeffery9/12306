<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>12306 Next-Gen Ticketing Dashboard (Vue 3 + Tailwind + ESM)</title>
    <!-- Import Tailwind CSS Play CDN for cutting-edge utility-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Tailwind Configuration to match our glowing neon theme -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'slate-theme-dark': '#0b0f19',
              'slate-theme-light': '#1a152e',
              'rail-blue': '#38bdf8',
              'rail-blue-glow': 'rgba(56, 189, 248, 0.4)',
              'neon-emerald': '#10b981',
              'neon-emerald-glow': 'rgba(16, 185, 129, 0.4)',
              'neon-rose': '#f43f5e',
              'neon-rose-glow': 'rgba(244, 63, 94, 0.4)',
              'neon-amber': '#f59e0b',
              'neon-amber-glow': 'rgba(245, 158, 11, 0.4)',
            }
          }
        }
      }
    </script>
    <!-- Link physically split Stylesheet for custom station node animations and overrides -->
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="bg-gradient-to-br from-slate-theme-dark via-slate-900 to-slate-theme-light min-h-screen text-slate-100 p-6 sm:p-10 flex flex-col items-center">
    
    <!-- Main Vue App Container -->
    <div id="app" class="w-full max-w-[1000px] flex flex-col gap-8">
      
      <!-- Header -->
      <header class="text-center mb-2">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent drop-shadow-md mb-2">
          12306 Next-Gen Ticketing Dashboard
        </h1>
        <p class="text-slate-400 text-sm sm:text-base max-w-[620px] mx-auto leading-relaxed">
          基于 CQRS 读写分离、内存段位图预占与事务发件箱架构的高并发区间票务分配系统 MVP
          (Vue 3 + ESM 原生组件化编排)
        </p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mt-3">
          <span class="inline-block bg-sky-500/10 border border-sky-500/30 text-rail-blue px-3 py-1 rounded-full text-xs font-semibold shadow-[0_0_12px_rgba(56,189,248,0.1)]">
            复兴号 G888 次 ── 商务特等座舱
          </span>
          <div class="flex items-center bg-slate-800/80 border border-slate-700/60 rounded-full px-3 py-1 shadow-sm gap-2">
            <span class="text-slate-400 text-xs font-medium">🔌 后端引擎一键切换:</span>
            <select v-model="backendUrl" @change="saveBackendChoice" class="bg-transparent text-xs text-sky-400 font-bold border-none focus:outline-none cursor-pointer">
              <option value="http://localhost:8000" class="bg-slate-900 text-slate-100">Python API (Port 8000)</option>
              <option value="http://localhost:8001" class="bg-slate-900 text-slate-100">Go API (Port 8001)</option>
              <option value="http://localhost:8002" class="bg-slate-900 text-slate-100">.NET API (Port 8002)</option>
              <option value="http://localhost:8003" class="bg-slate-900 text-slate-100">Java Spring (Port 8003)</option>
              <option value="http://localhost:8004" class="bg-slate-900 text-slate-100">Rust Axum (Port 8004)</option>
            </select>
          </div>
        </div>
      </header>

      <!-- 1. Route Selector Component (V-Model Bound) -->
      <route-selector
        :stations="stations"
        v-model:from-station="fromStation"
        v-model:to-station="toStation"
        :active-track-style="activeTrackStyle"
        @select-station="selectStation"
        @query-availability="queryAvailability"
      ></route-selector>

      <!-- Split Panels Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- 2. Ticket Booking Component -->
        <ticket-booking
          :available-seats="availableSeats"
          v-model:passenger-count="passengerCount"
          :is-cache-miss="isCacheMiss"
          :is-querying-split="isQueryingSplit"
          :split-itinerary="splitItinerary"
          :is-reserve-disabled="isReserveDisabled"
          @query-split="querySplitItinerary"
          @reserve-ticket="reserveTicket"
          @reserve-split="reserveSplitTicket"
        ></ticket-booking>

        <!-- 3. Order Payment Component -->
        <order-payment
          :reservation-id="reservationId"
          :locked-passenger-count="lockedPassengerCount"
          :seconds-left="secondsLeft"
          :progress-bar-style="progressBarStyle"
          :computed-total-amount="computedTotalAmount"
          :is-paid="isPaid"
          :split-itinerary="splitItinerary"
          :is-split-reservation="isSplitReservation"
          :from-station="fromStation"
          :to-station="toStation"
          @pay-order="payOrder"
          @reset="resetWorkflow"
        ></order-payment>
      </div>

      <!-- 4. System Execution Logs Component -->
      <system-logs :logs="logs"></system-logs>

      <!-- 5. DevOps & Admin Console Component -->
      <devops-console
        @cron-release="triggerCronRelease"
        @quota-release="releaseLongDistanceQuota"
      ></devops-console>

    </div>

    <!-- ==================== VUE 3 COMPONENT TEMPLATES ==================== -->

    <!-- Template A: Route Selector Component -->
    <template id="route-selector-template">
      <div class="bg-slate-900/65 border border-white/5 rounded-2xl p-6 sm:p-7 backdrop-blur-md shadow-2xl transition-all duration-300 hover:border-sky-500/20 hover:shadow-sky-500/5">
        <div class="text-lg font-bold text-slate-100 mb-5 flex items-center gap-2 border-b border-white/5 pb-3">
          <svg class="text-rail-blue" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
          1. 选择乘坐区间 (Select Route)
        </div>

        <div class="relative px-4 py-10 sm:py-12 flex justify-between items-center bg-black/25 rounded-xl mb-6 overflow-hidden">
          <div class="absolute left-[10%] right-[10%] top-[48%] h-1 bg-slate-800 rounded-full z-10"></div>
          <div class="absolute left-[10%] top-[48%] h-1 bg-gradient-to-r from-sky-400 to-indigo-500 shadow-[0_0_12px_#38bdf8] rounded-full z-20 transition-all duration-500" :style="activeTrackStyle"></div>

          <div
            v-for="station in stations"
            :key="station.seq"
            class="relative flex flex-col items-center z-30 cursor-pointer station-node"
            :class="{ active: station.seq >= fromStation && station.seq <= toStation }"
            @click="$emit('select-station', station.seq)"
          >
            <div class="w-3.5 h-3.5 bg-slate-600 border-2 border-slate-900 rounded-full transition-all duration-300 station-dot"></div>
            <div class="text-sm font-semibold text-slate-400 mt-3 transition-colors duration-300 station-name">
              {{ station.name }} ({{ station.seq }})
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
          <div class="flex flex-col gap-2">
            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">出发站 (From)</label>
            <select :value="fromStation" @input="$emit('update:fromStation', parseInt($event.target.value))" class="bg-slate-850 border border-white/5 text-slate-100 px-4 py-3 rounded-xl text-sm outline-none transition-all focus:border-rail-blue focus:ring-1 focus:ring-rail-blue">
              <option v-for="s in stations.slice(0, 3)" :key="s.seq" :value="s.seq">
                {{ s.name }} (Seq {{ s.seq }})
              </option>
            </select>
          </div>
          <div class="flex flex-col gap-2">
            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">到达站 (To)</label>
            <select :value="toStation" @input="$emit('update:toStation', parseInt($event.target.value))" class="bg-slate-850 border border-white/5 text-slate-100 px-4 py-3 rounded-xl text-sm outline-none transition-all focus:border-rail-blue focus:ring-1 focus:ring-rail-blue">
              <option v-for="s in stations.slice(1)" :key="s.seq" :value="s.seq" :disabled="s.seq <= fromStation">
                {{ s.name }} (Seq {{ s.seq }})
              </option>
            </select>
          </div>
          <div class="flex flex-col justify-end">
            <button class="font-semibold flex items-center justify-center gap-2 bg-gradient-to-r from-sky-500 to-indigo-600 border-none text-slate-100 px-5 py-3 rounded-xl shadow-lg shadow-indigo-500/10 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-indigo-500/20 active:translate-y-0" @click="$emit('query-availability')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              实时余票查询
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Template B: Ticket Booking Component -->
    <template id="ticket-booking-template">
      <div class="bg-slate-900/65 border border-white/5 rounded-2xl p-6 sm:p-7 backdrop-blur-md shadow-2xl transition-all duration-300 hover:border-sky-500/20 hover:shadow-sky-500/5 flex flex-col justify-between">
        <div>
          <div class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2 border-b border-white/5 pb-3">
            <svg class="text-rail-blue" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            2. 余票状态与抢票预占
          </div>

          <p class="text-slate-400 text-xs mb-5">
            本切片余票信息来自高并发 Redis 读视图。支持相邻座自动推荐。
          </p>

          <div class="flex flex-col gap-2 mb-5">
            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">乘车旅客人数 (Group Size)</label>
            <select :value="passengerCount" @input="$emit('update:passengerCount', parseInt($event.target.value))" class="bg-slate-850 border border-white/5 text-slate-100 px-4 py-3 rounded-xl text-sm outline-none transition-all focus:border-rail-blue focus:ring-1 focus:ring-rail-blue w-full">
              <option :value="1">1 人出行 (单座原子检索)</option>
              <option :value="2">2 人出行 (多人同厢邻座寻优)</option>
            </select>
          </div>

          <div v-if="availableSeats === null" class="flex items-center justify-center p-6 bg-slate-950/40 rounded-xl border border-dashed border-slate-800">
            <div class="text-slate-500 text-center text-sm">
              请在上方选择起止车站并点击【实时余票查询】
            </div>
          </div>

          <div v-else class="flex items-center justify-between p-5 rounded-xl border transition-all duration-300" :class="availableSeats > 0 ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-rose-500/30 bg-rose-500/5'">
            <div class="flex flex-col gap-1">
              <span class="text-base font-bold text-slate-100">BUSINESS (商务座舱)</span>
              <div>
                <span class="inline-block text-xs font-bold px-2 py-0.5 rounded" :class="isCacheMiss ? 'bg-amber-500/10 text-neon-amber animate-pulse' : 'bg-emerald-500/10 text-neon-emerald'">
                  {{ isCacheMiss ? 'Cache Miss - Self Healing' : 'Redis Cache Hit' }}
                </span>
              </div>
            </div>
            <div class="flex items-baseline gap-0.5">
              <span class="text-3xl font-extrabold tracking-tight" :class="availableSeats > 0 ? 'text-neon-emerald' : 'text-neon-rose'">{{ availableSeats }}</span>
              <span class="text-xs text-slate-400">张</span>
            </div>
          </div>

          <!-- Smart Split-Seat Recomposition Card -->
          <div v-if="availableSeats === 0" class="bg-amber-500/5 border border-dashed border-amber-500/30 rounded-xl p-5 mt-5 animate-[fadeIn_0.4s_ease]">
            <div class="text-sm font-bold text-neon-amber flex items-center gap-1.5 mb-2">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
              </svg>
              智能拼座接续推荐 (EPIC-06)
            </div>
            <div class="text-xs text-slate-400 leading-relaxed mb-4">
              检测到该直达区间当前无直接席位。启动同车断配自愈引擎，可智能匹配中转拼接，无需旅客人工换乘！
            </div>
            
            <button 
              v-if="!splitItinerary" 
              class="w-full text-xs font-semibold py-2.5 px-4 rounded-lg bg-transparent border border-slate-700 text-slate-400 hover:border-rail-blue hover:text-slate-100 hover:shadow-[0_0_8px_rgba(56,189,248,0.15)] transition-all duration-200" 
              @click="$emit('query-split')"
              :disabled="isQueryingSplit"
            >
              {{ isQueryingSplit ? '接续推演中...' : '搜寻中途拼座接续方案' }}
            </button>

            <div v-else-if="splitItinerary.split_found" class="mt-2">
              <div class="bg-black/35 rounded-lg p-3 font-mono text-xs text-neon-amber mb-3 border border-amber-500/10">
                接续中转点: Seq {{ splitItinerary.mid_seq }} | {{ splitItinerary.description }}
              </div>
              <button class="w-full text-xs font-semibold py-2.5 px-4 rounded-lg bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 border-none text-slate-100 shadow-md shadow-emerald-950/20 transition-all duration-200" @click="$emit('reserve-split')">
                确认预占拼座接续车票
              </button>
            </div>
            <div v-else class="text-xs text-neon-rose text-center font-semibold mt-2">
              中转点检索耗尽，该区间目前无可用拼座方案。
            </div>
          </div>
        </div>

        <button
          class="w-full font-semibold flex items-center justify-center gap-2 bg-gradient-to-r from-sky-500 to-indigo-600 border-none text-slate-100 px-5 py-3.5 rounded-xl shadow-lg shadow-indigo-500/10 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-indigo-500/20 active:translate-y-0 disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none mt-6"
          @click="$emit('reserve-ticket')"
          :disabled="isReserveDisabled"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          {{ passengerCount === 2 ? '立即预占相邻座位 (2张)' : '立即抢票预占 (Reserve)' }}
        </button>
      </div>
    </template>

    <!-- Template C: Order Payment Component -->
    <template id="order-payment-template">
      <div class="bg-slate-900/65 border border-white/5 rounded-2xl p-6 sm:p-7 backdrop-blur-md shadow-2xl transition-all duration-300 hover:border-sky-500/20 hover:shadow-sky-500/5 flex flex-col justify-between">
        <div>
          <div class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2 border-b border-white/5 pb-3">
            <svg class="text-rail-blue" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <rect x="2" y="4" width="20" height="16" rx="2" ry="2"/>
              <line x1="12" y1="4" x2="12" y2="20"/>
            </svg>
            3. 收费、订单与最终确认
          </div>

          <!-- Case A: Holding State -->
          <div v-if="reservationId && !isPaid" class="animate-[fadeIn_0.4s_ease]">
            <p class="text-slate-400 text-xs mb-4 leading-relaxed">
              座位已被锁定。请在下方支付期限内进行确认，超时将自动释放：
            </p>

            <div class="bg-black/25 rounded-xl p-4 flex flex-col gap-3">
              <div class="flex justify-between text-xs">
                <span class="text-slate-400">锁定预约 ID:</span>
                <span class="font-bold font-mono text-rail-blue">{{ reservationId }}</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400">出行人数:</span>
                <span class="font-bold">{{ lockedPassengerCount }} 人</span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-slate-400">支付倒计时:</span>
                <span class="font-bold font-mono text-neon-amber text-shadow-[0_0_8px_rgba(245,158,11,0.4)]">
                  {{ secondsLeft > 0 ? secondsLeft + ' 秒' : '已过期' }}
                </span>
              </div>
              <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden mt-1">
                <div class="h-full bg-gradient-to-r from-neon-amber to-neon-rose transition-all duration-1000" :style="progressBarStyle"></div>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-5">
              <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">实时结算金额 (动态计价)</label>
                <div class="text-2xl font-black text-neon-amber">
                  ¥ {{ computedTotalAmount.toFixed(2) }}
                </div>
              </div>
              <div class="flex flex-col justify-end">
                <button
                  class="w-full font-semibold flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 border-none text-slate-100 px-5 py-3 rounded-xl shadow-lg shadow-emerald-500/10 transition-all duration-200 disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed disabled:transform-none"
                  @click="$emit('pay-order')"
                  :disabled="secondsLeft <= 0"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                    <line x1="1" y1="10" x2="23" y2="10"/>
                  </svg>
                  确认模拟支付
                </button>
              </div>
            </div>
          </div>

          <!-- Case B: Success State -->
          <div v-else-if="isPaid" class="flex flex-col items-center justify-center gap-4 bg-emerald-500/5 border border-emerald-500/20 rounded-xl p-6 text-center animate-[fadeIn_0.4s_ease]">
            <div class="w-11 h-11 rounded-full bg-neon-emerald flex items-center justify-center text-slate-900 text-xl font-bold shadow-[0_0_15px_rgba(16,185,129,0.4)]">✓</div>
            <div class="text-lg font-bold text-neon-emerald">车票预定成功并已支付！</div>
            <p class="text-slate-400 text-xs">
              列车配席系统已成功下发物理车票并写入 outbox 发件箱：
            </p>
            
            <div class="bg-slate-850 border border-white/5 rounded-lg p-4 w-full flex flex-col gap-2.5 font-mono text-xs text-left">
              <div class="flex justify-between">
                <span class="text-rail-blue font-bold">复兴号 G888 次</span>
                <span class="text-neon-emerald font-bold">¥ {{ computedTotalAmount.toFixed(2) }}</span>
              </div>
              <div class="flex justify-between border-t border-white/5 pt-2 text-slate-400">
                <span>区间: Seq {{ fromStation }} ──► Seq {{ toStation }}</span>
                <span>商务舱</span>
              </div>
              <div v-if="lockedPassengerCount === 2" class="flex justify-between text-rail-blue">
                <span>席位 1: 01车厢 01A号席 (靠窗)</span>
                <span>席位 2: 01车厢 01C号席 (过道)</span>
              </div>
              <div v-else-if="isSplitReservation" class="flex flex-col gap-1 text-neon-amber text-[11px] leading-normal">
                <div>Leg 1: 01车厢 01A号席 (Seq {{ fromStation }}->{{ splitItinerary.mid_seq }})</div>
                <div>Leg 2: 01车厢 02C号席 (Seq {{ splitItinerary.mid_seq }}->{{ toStation }})</div>
              </div>
              <div v-else class="flex justify-between text-rail-blue">
                <span>分配席位: 01车厢 01A号 (商务极速占)</span>
              </div>
            </div>
            
            <button class="w-full font-semibold py-2.5 px-4 rounded-lg bg-transparent border border-slate-700 text-slate-400 hover:border-rail-blue hover:text-slate-100 transition-all duration-200" @click="$emit('reset')">
              返回继续预订
            </button>
          </div>

          <!-- Case C: Empty Placeholder -->
          <div v-else class="flex flex-col items-center justify-center text-slate-500 py-14">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="mb-3 text-slate-700">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <div class="text-sm">暂无待付订单</div>
          </div>
        </div>
      </div>
    </template>

    <!-- Template D: System Logs Component -->
    <template id="system-logs-template">
      <div class="bg-slate-900/65 border border-white/5 rounded-2xl p-6 sm:p-7 backdrop-blur-md shadow-2xl transition-all duration-300 hover:border-sky-500/20 hover:shadow-sky-500/5">
        <div class="text-lg font-bold text-slate-100 mb-4 flex items-center gap-2 border-b border-white/5 pb-3">
          <svg class="text-rail-blue" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </svg>
          4. 实时系统执行日志 (Agent Console Logs)
        </div>
        <div id="console-logs" class="bg-slate-950 border border-white/5 rounded-xl p-4 font-mono text-xs text-rail-blue h-[170px] overflow-y-auto flex flex-col gap-1.5 leading-normal">
          <div class="flex gap-2" v-for="(log, idx) in logs" :key="idx">
            <span class="text-slate-500 shrink-0">[{{ log.time }}]</span>
            <span class="break-all" :style="{ color: log.color }">{{ log.text }}</span>
          </div>
        </div>
      </div>
    </template>

    <!-- Template E: DevOps Console Component -->
    <template id="devops-console-template">
      <div class="bg-slate-900/65 border border-amber-500/10 rounded-2xl p-6 sm:p-7 backdrop-blur-md shadow-2xl transition-all duration-300 hover:border-amber-500/25 hover:shadow-amber-500/5">
        <div class="text-lg font-bold text-neon-amber mb-5 flex items-center gap-2 border-b border-white/5 pb-3">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          5. DevOps 应急封锁与调度控制台 (DevOps Dashboard)
        </div>
        
        <!-- Action 1: Timeout Release -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-white/5 pb-5 mb-5">
          <div class="text-xs text-slate-400 leading-relaxed sm:max-w-[70%]">
            <strong class="text-slate-200">未支付超时回收（Cron Job）：</strong>
            当系统中有【未支付超时】的预占订购单时，手动触发此项，系统将自动回滚 Redis 与 MySQL 中的位掩码状态，发还座位给票池。
          </div>
          <button class="w-full sm:w-auto text-xs font-semibold py-2.5 px-4 rounded-lg bg-transparent border border-slate-700 text-slate-400 hover:border-rail-blue hover:text-slate-100 transition-all duration-200" @click="$emit('cron-release')">
            <svg class="mr-1.5 inline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            触发超时未付释放
          </button>
        </div>

        <!-- Action 2: Quota Merger/Release -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
          <div class="text-xs text-slate-400 leading-relaxed sm:max-w-[70%]">
            <strong class="text-slate-200">长途限售专属配额释放（EPIC-07）：</strong>
            当列车临近开车（如发车前 24 小时）时，手动解封全部长途专属配额（Seat 01A）。系统将原子解封并重算投影，使短途购票立即可售！
          </div>
          <button class="w-full sm:w-auto text-xs font-semibold py-2.5 px-4 rounded-lg bg-transparent border border-amber-500/40 text-neon-amber hover:bg-amber-500/5 hover:border-neon-amber hover:shadow-[0_0_10px_var(--color-amber-glow)] transition-all duration-200" @click="$emit('quota-release')">
            <svg class="mr-1.5 inline" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            解封长途配额合并
          </button>
        </div>
      </div>
    </template>

    <!-- Link physically split Vue Application logic module (Natively served as ES Module) -->
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
